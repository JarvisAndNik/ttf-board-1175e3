<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tap → Follow — Homes</title>
<style>
body{margin:0;background:#0C1214;color:#EAF2F0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:24px;max-width:420px}
h1{font-family:'Avenir Next Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:30px;
  letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
h1 span{color:#4FC8C4}
p{color:#8FA5A1;font-size:12px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;line-height:1.7}
.err{color:#FF6B4A}
</style>
</head>
<body>
<div class="box">
  <h1>Tap <span>→</span> VIP</h1>
  <p id="st">UNLOCKING…</p>
</div>
<script>
(async function(){
  const st = document.getElementById('st');
  const LS = 'ttf-site-key';
  let k = (location.hash.match(/[#&]k=([A-Za-z0-9_-]+)/) || [])[1] || '';
  if (k) { try { localStorage.setItem(LS, k); } catch(e){} }
  else { try { k = localStorage.getItem(LS) || ''; } catch(e){} }
  if (!k) { st.innerHTML = '<span class="err">LOCKED</span><br>open this board from your saved bookmark link'; return; }
  function b64uToBytes(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '=';
    const bin = atob(s), a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  try {
    const resp = await fetch('payload-homes.b64', {cache: 'no-store'});
    if (!resp.ok) throw new Error('payload fetch ' + resp.status);
    const raw = b64uToBytes((await resp.text()).trim());
    const key = await crypto.subtle.importKey('raw', b64uToBytes(k), 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(
      await crypto.subtle.decrypt({name:'AES-GCM', iv: raw.subarray(0,12)}, key, raw.subarray(12)));
    document.open(); document.write(html); document.close();
  } catch(e) {
    st.innerHTML = '<span class="err">UNLOCK FAILED</span><br>' +
      (k ? 'wrong or outdated key — use your latest bookmark link' : '') +
      '<br>' + String(e).slice(0,80);
    try { localStorage.removeItem(LS); } catch(_){}
  }
})();
</script>
</body>
</html>
